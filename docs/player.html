<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gully Rewind Player</title>
  <style>html,body{margin:0;padding:0;background:#000;}</style>
</head>
<body>
<div id="player"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  function getVideoId() {
    var params = new URLSearchParams(window.location.search);
    return params.get('v') || '';
  }

  var player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '200',
      width: '200',
      videoId: getVideoId(),
      playerVars: { autoplay: 1, playsinline: 1, controls: 0, mute: 1 },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onError: onPlayerError
      }
    });
  }

  function onPlayerReady(e) {
    e.target.mute();
    e.target.playVideo();
    setTimeout(function () {
      e.target.unMute();
      e.target.setVolume(100);
      if (window.AndroidBridge) AndroidBridge.onReady();
    }, 800);
  }

  function onPlayerStateChange(event) {
    if (!window.AndroidBridge) return;
    if (event.data === YT.PlayerState.ENDED) AndroidBridge.onEnded();
    if (event.data === YT.PlayerState.PLAYING) AndroidBridge.onStateChanged('playing');
    if (event.data === YT.PlayerState.PAUSED) AndroidBridge.onStateChanged('paused');
  }

  function onPlayerError(event) {
    if (window.AndroidBridge) AndroidBridge.onError(event.data);
  }

  function resumeVideoNow() {
    if (player && player.playVideo) player.playVideo();
  }

  function pauseVideoNow() {
    if (player && player.pauseVideo) player.pauseVideo();
  }
</script>
</body>
</html>
